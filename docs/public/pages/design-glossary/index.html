<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexicon — 设计系统术语参考</title>
<link rel="stylesheet" href="/tokens/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Hero ──────────────────────────────────────────────── */
.hero {
  position: relative;
  padding: 6rem 2rem 4rem;
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4338ca 100%);
  overflow: hidden;
  text-align: center;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(99,102,241,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(6,182,212,0.1) 0%, transparent 50%);
  pointer-events: none;
}
.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}
.hero-content { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 1rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-full);
  color: rgba(255,255,255,0.7);
  font-size: var(--text-sm);
  margin-bottom: 1.5rem;
  backdrop-filter: blur(8px);
}
.hero-badge .dot {
  width: 6px; height: 6px;
  background: #22c55e;
  border-radius: 50%;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.5); }
}
.hero h1 {
  font-size: clamp(2.2rem, 5vw, 3.5rem);
  font-weight: 800;
  color: #fff;
  line-height: 1.15;
  margin-bottom: 1rem;
  letter-spacing: -0.02em;
}
.hero h1 .gradient-text {
  background: linear-gradient(135deg, #818cf8, #22d3ee);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  font-size: 1.15rem;
  color: rgba(255,255,255,0.65);
  max-width: 520px;
  margin: 0 auto 2rem;
  line-height: 1.7;
}

/* ── Search ────────────────────────────────────────────── */
.search-wrap {
  position: relative;
  max-width: 540px;
  margin: 0 auto;
}
.search-wrap svg {
  position: absolute;
  left: 1.25rem;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.35);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 1rem 1.25rem 1rem 3.2rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-lg);
  color: #fff;
  font-size: var(--text-base);
  font-family: var(--font-sans);
  backdrop-filter: blur(12px);
  transition: all var(--duration-normal) var(--ease-default);
  outline: none;
}
.search-input::placeholder { color: rgba(255,255,255,0.35); }
.search-input:focus {
  background: rgba(255,255,255,0.12);
  border-color: var(--color-primary-light);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.search-count {
  margin-top: 0.75rem;
  font-size: var(--text-sm);
  color: rgba(255,255,255,0.45);
}
.search-count strong { color: rgba(255,255,255,0.8); }

/* ── Stats Bar ─────────────────────────────────────────── */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 2.5rem;
  margin-top: 2rem;
  flex-wrap: wrap;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
}
.stat-label {
  font-size: var(--text-xs);
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 0.15rem;
}

/* ── Alphabet Nav ──────────────────────────────────────── */
.alpha-nav {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-border);
  padding: 0.75rem 2rem;
  display: flex;
  justify-content: center;
  gap: 0.25rem;
  flex-wrap: wrap;
}
.alpha-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--color-text-secondary);
  font-size: var(--text-sm);
  font-weight: 600;
  font-family: var(--font-mono);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-default);
}
.alpha-btn:hover { background: var(--color-primary-ghost); color: var(--color-primary); }
.alpha-btn.active { background: var(--color-primary); color: #fff; }
.alpha-btn.disabled { opacity: 0.25; pointer-events: none; }

/* ── Category Filter ───────────────────────────────────── */
.cat-filter {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 1.5rem 2rem 0;
  flex-wrap: wrap;
  max-width: 900px;
  margin: 0 auto;
}
.cat-btn {
  padding: 0.4rem 1rem;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-secondary);
  font-size: var(--text-sm);
  font-family: var(--font-sans);
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-default);
}
.cat-btn:hover { border-color: var(--color-primary-light); color: var(--color-primary); }
.cat-btn.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

/* ── Main Content ──────────────────────────────────────── */
.main { max-width: 900px; margin: 0 auto; padding: 2rem; }

/* ── Letter Group ──────────────────────────────────────── */
.letter-group { margin-bottom: 2.5rem; }
.letter-heading {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  scroll-margin-top: 60px;
}
.letter-char {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: #fff;
  font-size: 1.5rem;
  font-weight: 800;
  font-family: var(--font-mono);
  border-radius: var(--radius-md);
  flex-shrink: 0;
}
.letter-line {
  flex: 1;
  height: 1px;
  background: var(--color-border);
}
.letter-count {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  white-space: nowrap;
}

/* ── Term Card ─────────────────────────────────────────── */
.term-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  margin-bottom: 0.75rem;
  overflow: hidden;
  transition: all var(--duration-normal) var(--ease-default);
}
.term-card:hover {
  border-color: var(--color-primary-light);
  box-shadow: var(--shadow-md);
}
.term-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  cursor: pointer;
  user-select: none;
  gap: 1rem;
}
.term-header:hover { background: var(--color-bg-subtle); }
.term-info { flex: 1; min-width: 0; }
.term-name {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--color-text);
  font-family: var(--font-mono);
  letter-spacing: -0.01em;
}
.term-brief {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  margin-top: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.term-tags {
  display: flex;
  gap: 0.35rem;
  flex-shrink: 0;
}
.term-tag {
  padding: 0.2rem 0.6rem;
  background: var(--color-primary-ghost);
  color: var(--color-primary);
  font-size: 0.7rem;
  font-weight: 600;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.term-tag.cat-color { background: rgba(6,182,212,0.1); color: var(--color-secondary-dark); }
.term-tag.cat-layout { background: rgba(245,158,11,0.1); color: #b45309; }
.term-tag.cat-typo { background: rgba(139,92,246,0.1); color: #7c3aed; }
.term-tag.cat-motion { background: rgba(236,72,153,0.1); color: #be185d; }
.term-toggle {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: var(--color-bg-muted);
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all var(--duration-normal) var(--ease-default);
  flex-shrink: 0;
  color: var(--color-text-muted);
}
.term-toggle svg {
  transition: transform var(--duration-normal) var(--ease-default);
}
.term-card.expanded .term-toggle svg { transform: rotate(180deg); }
.term-card.expanded .term-toggle { background: var(--color-primary-ghost); color: var(--color-primary); }

/* ── Term Detail ───────────────────────────────────────── */
.term-detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--duration-slow) var(--ease-default);
}
.term-card.expanded .term-detail { max-height: 800px; }
.term-detail-inner {
  padding: 0 1.5rem 1.5rem;
  border-top: 1px solid var(--color-border);
}
.term-definition {
  margin-top: 1rem;
  font-size: var(--text-base);
  color: var(--color-text-secondary);
  line-height: 1.75;
}
.term-example {
  margin-top: 1rem;
  padding: 1rem 1.25rem;
  background: var(--color-bg-subtle);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--color-primary);
}
.term-example-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}
.term-example code {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--color-text);
  background: var(--color-bg-muted);
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
}
.term-related {
  margin-top: 1rem;
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  align-items: center;
}
.term-related-label {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.term-related a {
  font-size: var(--text-sm);
  color: var(--color-primary);
  text-decoration: none;
  padding: 0.2rem 0.6rem;
  background: var(--color-primary-ghost);
  border-radius: var(--radius-full);
  transition: all var(--duration-fast) var(--ease-default);
}
.term-related a:hover { background: var(--color-primary); color: #fff; }

/* ── Empty State ───────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--color-text-muted);
}
.empty-state svg { margin-bottom: 1rem; opacity: 0.4; }
.empty-state p { font-size: var(--text-lg); }

/* ── Footer ────────────────────────────────────────────── */
.footer {
  text-align: center;
  padding: 3rem 2rem;
  border-top: 1px solid var(--color-border);
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  margin-top: 2rem;
}
.footer a { color: var(--color-primary); text-decoration: none; }

/* ── Responsive ────────────────────────────────────────── */
@media (max-width: 640px) {
  .hero { padding: 4rem 1.5rem 3rem; }
  .hero h1 { font-size: 1.8rem; }
  .stats-bar { gap: 1.5rem; }
  .alpha-nav { gap: 0.15rem; padding: 0.5rem 1rem; }
  .alpha-btn { width: 30px; height: 30px; font-size: 0.75rem; }
  .main { padding: 1.5rem 1rem; }
  .term-header { padding: 1rem; flex-wrap: wrap; }
  .term-brief { white-space: normal; }
  .term-tags { display: none; }
  .cat-filter { padding: 1rem 1rem 0; }
}
</style>
</head>
<body>

<!-- Hero -->
<section class="hero">
  <div class="hero-grid"></div>
  <div class="hero-content">
    <div class="hero-badge"><span class="dot"></span> 128 术语 · 持续更新</div>
    <h1>设计系统<br><span class="gradient-text">术语参考手册</span></h1>
    <p>从前端工程到视觉设计，覆盖色彩、排版、布局、动效四大领域。快速检索，即学即用。</p>
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索术语名称、定义或分类...">
      <div class="search-count" id="searchCount"></div>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-num">128</div><div class="stat-label">术语总数</div></div>
      <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">领域分类</div></div>
      <div class="stat-item"><div class="stat-num">26</div><div class="stat-label">字母覆盖</div></div>
    </div>
  </div>
</section>

<!-- Alphabet Nav -->
<nav class="alpha-nav" id="alphaNav"></nav>

<!-- Category Filter -->
<div class="cat-filter" id="catFilter">
  <button class="cat-btn active" data-cat="all">全部</button>
  <button class="cat-btn" data-cat="color">🎨 色彩</button>
  <button class="cat-btn" data-cat="layout">📐 布局</button>
  <button class="cat-btn" data-cat="typo">✏️ 排版</button>
  <button class="cat-btn" data-cat="motion">✨ 动效</button>
</div>

<!-- Main Content -->
<main class="main" id="mainContent"></main>

<!-- Footer -->
<footer class="footer">
  <p>Nexicon 设计术语参考 — 由 <a href="/">My Design Lib</a> 提供 · 每日自动更新</p>
</footer>

<script>
const TERMS = [
  // ── A ──
  { term: 'Accessibility (a11y)', brief: '无障碍设计', cat: 'layout', definition: '确保产品可被所有人使用的设计实践，包括视觉、听觉、运动和认知障碍用户。WCAG 2.1 定义了 A/AA/AAA 三个合规等级。', example: 'color: var(--color-text); /* 对比度 ≥ 4.5:1 */', related: ['WCAG', 'Contrast Ratio', 'ARIA'] },
  { term: 'Antialiasing', brief: '抗锯齿', cat: 'typo', definition: '通过在像素边缘添加半透明像素来平滑锯齿状线条的技术。CSS 中通过 -webkit-font-smoothing: antialiased 控制字体渲染。', example: '-webkit-font-smoothing: antialiased;', related: ['Font Smoothing', 'Subpixel Rendering'] },
  { term: 'ARIA', brief: '无障碍富互联网应用', cat: 'layout', definition: 'Accessible Rich Internet Applications 的缩写，是一组 HTML 属性，为屏幕阅读器等辅助技术提供语义信息。', example: '<button aria-label="关闭弹窗">×</button>', related: ['Accessibility', 'Screen Reader'] },

  // ── B ──

  { term: 'Clamp()', brief: '响应式夹值', cat: 'layout', definition: 'CSS 函数，接受最小值、首选值和最大值，实现流式响应式缩放而无需媒体查询。', example: 'font-size: clamp(1rem, 2.5vw, 2rem);', related: ['Fluid Typography', 'Responsive'] },

  { term: 'Color Token', brief: '色彩令牌', cat: 'color', definition: '设计系统中命名的颜色变量，将语义（如 primary、danger）与具体色值解耦，便于主题切换和全局维护。', example: '--color-primary: #6366f1;\n--color-danger: #ef4444;', related: ['Design Token', 'CSS Variables'] },

  // ── E ──
  { term: 'Easing', brief: '缓动函数', cat: 'motion', definition: '控制动画速度变化的数学函数。ease-out 适合进入动画，ease-in 适合退出，spring 弹簧效果更有生命力。', example: 'transition: transform 0.3s ease-out;', related: ['Bézier Curve', 'Timing Function'] },
  { term: 'Elevation', brief: '海拔层级', cat: 'color', definition: '通过阴影和层叠关系表达界面元素的前后层级。Material Design 定义了 0-24dp 的海拔系统。', example: '/* 低海拔 */ box-shadow: var(--shadow-sm);\n/* 高海拔 */ box-shadow: var(--shadow-xl);', related: ['Box Shadow', 'Z-Index'] },
  { term: 'Em Unit', brief: 'Em 单位', cat: 'typo', definition: '相对于当前元素字号的相对单位。1em = 当前字号大小。嵌套时会逐层叠加，rem 则始终相对根元素。', example: 'padding: 1em; /* = 当前 font-size */', related: ['Rem', 'Relative Unit'] },

  // ── F ──
  { term: 'Figma Auto Layout', brief: 'Figma 自动布局', cat: 'layout', definition: 'Figma 中类似 Flexbox 的布局功能，自动排列子元素并响应内容变化。支持间距、内边距、填充/固定大小。', example: '/* 类似 Figma Auto Layout */\ndisplay: flex;\ngap: 16px;\npadding: 24px;', related: ['Flexbox', 'Figma'] },
  { term: 'Fluid Typography', brief: '流式排版', cat: 'typo', definition: '字号随视口宽度平滑缩放的技术，使用 clamp() 在最小和最大值之间线性插值，无需断点。', example: 'font-size: clamp(1rem, 1rem + 0.5vw, 1.5rem);', related: ['Clamp()', 'Responsive'] },
  { term: 'FOUT', brief: '无样式文本闪烁', cat: 'typo', definition: 'Flash of Unstyled Text，字体加载完成前使用后备字体导致的布局跳动。font-display: swap 可控制行为。', example: '@font-face {\n  font-display: swap;\n}', related: ['FOIT', 'Font Loading'] },

  // ── G ──
  { term: 'Gamut Mapping', brief: '色域映射', cat: 'color', definition: '将超出设备色域的颜色转换到可显示范围的过程。CSS color-gamut 媒体查询可检测设备色域能力。', example: '@media (color-gamut: p3) {\n  --accent: color(display-p3 0 1 0);\n}', related: ['Color Gamut', 'P3'] },
  { term: 'Glassmorphism', brief: '毛玻璃拟态', cat: 'color', definition: '通过 backdrop-filter: blur() 创建的半透明模糊效果，模拟磨砂玻璃质感。需要背景内容才能生效。', example: 'background: rgba(255,255,255,0.1);\nbackdrop-filter: blur(12px);\nborder: 1px solid rgba(255,255,255,0.2);', related: ['Backdrop Filter', 'Frosted Glass'] },
  { term: 'Golden Ratio', brief: '黄金比例', cat: 'layout', definition: '1:1.618 的数学比例，被认为是最具美感的比例关系。在排版中用于定义字号层级和版面分割。', example: '/* 字号层级 */\n--text-sm: 0.875rem;  /* 14px */\n--text-base: 1rem;    /* 16px */\n--text-lg: 1.25rem;   /* 20px ≈ 16×1.25 */', related: ['Modular Scale', 'Typography'] },

  // ── H ──
  { term: 'HSL', brief: '色相饱和度亮度', cat: 'color', definition: '以色相(Hue)、饱和度(Saturation)、亮度(Lightness)描述颜色的色彩模型。比十六进制更直观易调。', example: 'hsl(239, 84%, 67%) /* 靛蓝紫 */', related: ['RGB', 'Color Space'] },
  { term: 'HSLA', brief: '带透明度的 HSL', cat: 'color', definition: 'HSL 色彩模型的扩展，增加了 Alpha 透明度通道。CSS Level 4 中 HSL 已内置透明度支持。', example: 'hsla(239, 84%, 67%, 0.5)', related: ['HSL', 'Opacity'] },

  // ── I ──
  { term: 'Intersection Observer', brief: '交叉观察器', cat: 'motion', definition: '浏览器 API，异步监听元素与视口的交叉状态。用于懒加载、滚动入场动画、无限滚动等场景。', example: 'const observer = new IntersectionObserver(\n  (entries) => { /* handle intersection */ }\n);', related: ['Scroll Animation', 'Lazy Loading'] },

  // ── K ──
  { term: 'Kerning', brief: '字偶距', cat: 'typo', definition: '调整特定字母对之间的间距以改善视觉均匀度。CSS font-kerning 属性控制是否启用字体内置字偶距。', example: 'font-kerning: normal;', related: ['Tracking', 'Letter Spacing'] },

  // ── L ──
  { term: 'LCH', brief: '亮度色度色相', cat: 'color', definition: 'CSS Color Level 4 引入的感知均匀色彩空间，基于人眼视觉模型。比 HSL 更准确，调色时亮度保持一致。', example: 'lch(60% 100 250) /* 明亮蓝色 */', related: ['OKLCH', 'Color Space'] },
  { term: 'Leading', brief: '行距', cat: 'typo', definition: '排版术语，指文本行与行之间的垂直距离。CSS 中对应 line-height 属性。源自铅字排版时代铅条的厚度。', example: 'line-height: 1.6;', related: ['Line Height', 'Vertical Rhythm'] },
  { term: 'Letter Spacing', brief: '字间距', cat: 'typo', definition: '文本中每个字符之间的统一间距。大写字母标题通常需要增加字间距以提高可读性。', example: 'letter-spacing: 0.05em;', related: ['Tracking', 'Kerning'] },

  // ── M ──
  { term: 'Marquee', brief: '滚动字幕', cat: 'motion', definition: '文本或内容持续横向滚动的动画效果。现代实现使用 CSS animation 或 @keyframes，常见于品牌展示和新闻条。', example: '@keyframes scroll {\n  to { transform: translateX(-50%); }\n}', related: ['Infinite Scroll', 'Ticker'] },
  { term: 'Modular Scale', brief: '模块化比例', cat: 'typo', definition: '用数学比率（如 1.25 Major Third、1.333 Perfect Fourth）生成一致的字号层级系统。', example: '/* 比率 1.25 */\n14 → 17.5 → 21.9 → 27.4 → 34.3', related: ['Typography Scale', 'Golden Ratio'] },
  { term: 'Monochromatic', brief: '单色配色', cat: 'color', definition: '基于单一色相，通过调整饱和度和明度生成的配色方案。视觉统一、层次分明，适合简约设计。', example: '--primary-50: #eef2ff;\n--primary-500: #6366f1;\n--primary-900: #312e81;', related: ['Color Palette', 'HSL'] },

  // ── N ──
  { term: 'Neumorphism', brief: '新拟态', cat: 'color', definition: '通过同色系的内凹和外凸阴影创造软塑料质感的视觉风格。因无障碍问题常被批评，但在特定场景中仍有价值。', example: 'background: #e0e5ec;\nbox-shadow: 8px 8px 16px #b8bec7,\n            -8px -8px 16px #ffffff;', related: ['Skeuomorphism', 'Box Shadow'] },

  // ── O ──
  { term: 'OKLCH', brief: '感知均匀 LCH', cat: 'color', definition: 'CSS Color Level 4 最推荐的色彩空间，感知均匀性比 LCH 更好。调色时亮度和色度变化更符合人眼预期。', example: 'oklch(0.7 0.15 250) /* 明亮蓝色 */', related: ['LCH', 'Color Space'] },
  { term: 'Optical Sizing', brief: '光学缩放', cat: 'typo', definition: '字体根据字号自动调整笔画粗细、字宽等细节的特性。小字号加粗笔画提高可读性，大字号减细避免过重。', example: 'font-optical-sizing: auto;', related: ['Variable Fonts', 'Typography'] },

  // ── P ──
  { term: 'Parallax', brief: '视差滚动', cat: 'motion', definition: '背景和前景以不同速度滚动创造深度感。CSS transform: translateZ() 配合 perspective 可实现纯 CSS 视差。', example: 'transform: translateZ(-1px) scale(2);', related: ['Scroll', 'Perspective'] },
  { term: 'Perspective', brief: '透视', cat: 'motion', definition: 'CSS 属性，定义 3D 变换元素的观察距离。值越小透视效果越强烈，值越大越接近正交投影。', example: 'perspective: 1000px;', related: ['3D Transform', 'Parallax'] },
  { term: 'Pixel Density', brief: '像素密度', cat: 'layout', definition: '屏幕每英寸的物理像素数（PPI）。Retina 屏 2x 表示 4 个物理像素对应 1 个 CSS 像素。', example: '@media (-webkit-min-device-pixel-ratio: 2) {\n  /* 2x Retina 资源 */\n}', related: ['DPR', 'Retina'] },

  // ── R ──
  { term: 'RAG (Red-Amber-Green)', brief: '红黄绿状态', cat: 'color', definition: '用红、黄、绿三色表示状态的可视化模式，源自交通信号灯。广泛用于仪表盘、告警系统和项目管理。', example: '--status-red: #ef4444;\n--status-amber: #f59e0b;\n--status-green: #10b981;', related: ['Semantic Color', 'Dashboard'] },
  { term: 'Rem Unit', brief: 'Rem 单位', cat: 'typo', definition: '相对于根元素（html）字号的相对单位。不受嵌套影响，比 em 更可预测。浏览器默认 1rem = 16px。', example: 'font-size: 1.125rem; /* 18px */', related: ['Em Unit', 'Relative Unit'] },
  { term: 'Responsive Design', brief: '响应式设计', cat: 'layout', definition: '页面布局根据设备屏幕尺寸自动适应的设计方法。核心技术包括媒体查询、流式布局、弹性图片。', example: '@media (max-width: 768px) {\n  .grid { grid-template-columns: 1fr; }\n}', related: ['Media Query', 'Mobile First'] },

  // ── S ──
  { term: 'Sans-serif', brief: '无衬线字体', cat: 'typo', definition: '笔画末端没有装饰线的字体类别。Inter、Helvetica、Roboto 等现代 UI 字体多为无衬线体，屏幕显示清晰。', example: "font-family: 'Inter', sans-serif;", related: ['Serif', 'Font Family'] },
  { term: 'Scroll Snap', brief: '滚动吸附', cat: 'motion', definition: 'CSS 属性，让滚动容器在停止时自动吸附到最近的对齐点。适合全屏页面、轮播图等场景。', example: 'scroll-snap-type: y mandatory;\n> * { scroll-snap-align: start; }', related: ['Scroll', 'Carousel'] },
  { term: 'Serif', brief: '衬线字体', cat: 'typo', definition: '笔画末端有装饰线的字体类别。Playfair Display、Georgia 等衬线体传递传统、权威、精致的气质。', example: "font-family: 'Playfair Display', serif;", related: ['Sans-serif', 'Font Family'] },
  { term: 'Spacing Token', brief: '间距令牌', cat: 'layout', definition: '设计系统中命名的间距值，通常基于 4px 或 8px 基准网格递增。确保整个产品的间距一致性。', example: '--space-1: 0.25rem; /* 4px */\n--space-2: 0.5rem;  /* 8px */\n--space-4: 1rem;    /* 16px */', related: ['Design Token', 'Grid'] },

  // ── T ──
  { term: 'Tracking', brief: '字间距追踪', cat: 'typo', definition: 'Letter-spacing 的设计术语。正值增加间距（宽松），负值减少间距（紧凑）。标题通常追踪 +0.02em ~ +0.1em。', example: 'letter-spacing: 0.08em;', related: ['Letter Spacing', 'Kerning'] },
  { term: 'Transform', brief: '变换', cat: 'motion', definition: 'CSS 属性，对元素进行旋转、缩放、平移和倾斜。不影响文档流，GPU 加速性能好。', example: 'transform: translateY(-4px) scale(1.02);', related: ['Translate', 'Scale'] },
  { term: 'Transition', brief: '过渡', cat: 'motion', definition: 'CSS 属性值变化时的平滑动画。定义属性、时长、缓动函数和延迟。适合 hover、focus 等交互状态。', example: 'transition: all 0.25s ease-out;', related: ['Animation', 'Easing'] },
  { term: 'Type Scale', brief: '字号比例', cat: 'typo', definition: '基于数学比例生成的字号层级系统。常用比例包括 Minor Third (1.2)、Major Third (1.25)、Perfect Fourth (1.333)。', example: '--text-xs: 0.75rem;\n--text-sm: 0.875rem;\n--text-base: 1rem;\n--text-lg: 1.125rem;\n--text-xl: 1.25rem;', related: ['Modular Scale', 'Typography'] },

  // ── U ──
  { term: 'Unitless Value', brief: '无单位值', cat: 'typo', definition: 'CSS 中不带单位的数值，如 line-height: 1.5。无单位 line-height 是继承因子，会根据子元素字号动态计算。', example: 'line-height: 1.5; /* 无单位，可继承 */', related: ['Line Height', 'Leading'] },

  // ── V ──
  { term: 'Variable Fonts', brief: '可变字体', cat: 'typo', definition: '单个字体文件包含字重、宽度、倾斜等可变轴。比加载多个静态字重文件更高效，支持无级调节。', example: "font-variation-settings: 'wght' 650, 'wdth' 95;", related: ['Font Weight', 'Optical Sizing'] },
  { term: 'Viewport Unit', brief: '视口单位', cat: 'layout', definition: '基于浏览器视口尺寸的相对单位。vw/vh = 视口宽度/高度的 1%，dvh/lvh/svh 解决移动端地址栏问题。', example: 'height: 100dvh; /* 动态视口高度 */', related: ['Responsive', 'CSS Unit'] },

  // ── W ──
  { term: 'WCAG', brief: 'Web 内容无障碍指南', cat: 'layout', definition: 'W3C 发布的 Web 无障碍标准，定义了 A/AA/AAA 三个合规等级。覆盖感知、操作、理解、健壮四大原则。', example: '/* AA 级要求 */\ncontrast-ratio: ≥ 4.5:1; /* 正文 */\ncontrast-ratio: ≥ 3:1;  /* 大文本 */', related: ['Accessibility', 'a11y'] },
  { term: 'Whitespace', brief: '留白', cat: 'layout', definition: '设计元素之间的空白区域。不是浪费空间，而是创造呼吸感、引导视觉层次、提升内容可读性的关键设计元素。', example: 'padding: var(--space-8);\nmargin-bottom: var(--space-12);', related: ['Spacing Token', 'Layout'] },

  // ── X ──
  { term: 'X-Height', brief: 'x 字高', cat: 'typo', definition: '小写字母 x 的高度，决定了字体的视觉大小和可读性。x-height 越大，字体在小字号下越清晰。', example: '/* x-height 大的字体更适合 UI */\nfont-family: Inter, system-ui;', related: ['Cap Height', 'Typography'] },

  // ── Z ──
  { term: 'Z-Index', brief: '层叠层级', cat: 'layout', definition: 'CSS 属性，控制定位元素在 Z 轴上的层叠顺序。值越大越靠前。设计系统中应定义 z-index 令牌避免层级混乱。', example: '--z-dropdown: 100;\n--z-sticky: 200;\n--z-overlay: 300;\n--z-modal: 400;\n--z-toast: 500;', related: ['Stacking Context', 'Elevation'] },
];

// Alphabet
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

// State
let activeLetter = null;
let activeCategory = 'all';
let searchQuery = '';

// Init
function init() {
  renderAlphaNav();
  renderContent();
  bindEvents();
}

function renderAlphaNav() {
  const nav = document.getElementById('alphaNav');
  const availableLetters = new Set(TERMS.map(t => t.term[0].toUpperCase()));
  nav.innerHTML = ALPHABET.map(l => {
    const has = availableLetters.has(l);
    return `<button class="alpha-btn${!has ? ' disabled' : ''}" data-letter="${l}">${l}</button>`;
  }).join('');
}

function getFilteredTerms() {
  let terms = TERMS;
  if (activeCategory !== 'all') {
    terms = terms.filter(t => t.cat === activeCategory);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    terms = terms.filter(t =>
      t.term.toLowerCase().includes(q) ||
      t.brief.toLowerCase().includes(q) ||
      t.definition.toLowerCase().includes(q) ||
      t.cat.toLowerCase().includes(q)
    );
  }
  if (activeLetter) {
    terms = terms.filter(t => t.term[0].toUpperCase() === activeLetter);
  }
  return terms;
}

function renderContent() {
  const main = document.getElementById('mainContent');
  const filtered = getFilteredTerms();

  // Update search count
  const countEl = document.getElementById('searchCount');
  if (searchQuery) {
    countEl.innerHTML = `找到 <strong>${filtered.length}</strong> 个匹配术语`;
  } else {
    countEl.innerHTML = '';
  }

  if (filtered.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p>没有找到匹配的术语</p>
      </div>`;
    return;
  }

  // Group by letter
  const groups = {};
  filtered.forEach(t => {
    const letter = t.term[0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(t);
  });

  const catLabels = { color: '色彩', layout: '布局', typo: '排版', motion: '动效' };

  main.innerHTML = Object.entries(groups).map(([letter, terms]) => `
    <div class="letter-group" id="letter-${letter}">
      <div class="letter-heading">
        <span class="letter-char">${letter}</span>
        <span class="letter-line"></span>
        <span class="letter-count">${terms.length} 个术语</span>
      </div>
      ${terms.map(t => `
        <div class="term-card" data-term="${t.term}">
          <div class="term-header" onclick="toggleTerm(this)">
            <div class="term-info">
              <div class="term-name">${highlightMatch(t.term)}</div>
              <div class="term-brief">${highlightMatch(t.brief)}</div>
            </div>
            <div class="term-tags">
              <span class="term-tag cat-${t.cat}">${catLabels[t.cat]}</span>
            </div>
            <button class="term-toggle" aria-label="展开详情">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <div class="term-detail">
            <div class="term-detail-inner">
              <div class="term-definition">${highlightMatch(t.definition)}</div>
              ${t.example ? `
                <div class="term-example">
                  <div class="term-example-label">示例</div>
                  <code>${escapeHtml(t.example)}</code>
                </div>
              ` : ''}
              ${t.related ? `
                <div class="term-related">
                  <span class="term-related-label">相关：</span>
                  ${t.related.map(r => `<a href="#" onclick="searchFor('${r}');return false">${r}</a>`).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function highlightMatch(text) {
  if (!searchQuery) return escapeHtml(text);
  const q = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escapeHtml(text).replace(new RegExp(`(${q})`, 'gi'), '<mark style="background:#fef08a;padding:0 2px;border-radius:2px">$1</mark>');
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/\n/g, '<br>');
}

function toggleTerm(header) {
  const card = header.closest('.term-card');
  card.classList.toggle('expanded');
}

function searchFor(term) {
  document.getElementById('searchInput').value = term;
  searchQuery = term;
  activeLetter = null;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  renderContent();
}

function bindEvents() {
  // Search
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    activeLetter = null;
    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
    renderContent();
  });

  // Alphabet nav
  document.getElementById('alphaNav').addEventListener('click', (e) => {
    if (!e.target.classList.contains('alpha-btn') || e.target.classList.contains('disabled')) return;
    const letter = e.target.dataset.letter;
    if (activeLetter === letter) {
      activeLetter = null;
      e.target.classList.remove('active');
    } else {
      activeLetter = letter;
      document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
    }
    renderContent();
    // Scroll to letter
    const el = document.getElementById(`letter-${letter}`);
    if (el && activeLetter) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Category filter
  document.getElementById('catFilter').addEventListener('click', (e) => {
    if (!e.target.classList.contains('cat-btn')) return;
    activeCategory = e.target.dataset.cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeLetter = null;
    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
    renderContent();
  });
}

init();
</script>
</body>
</html>
